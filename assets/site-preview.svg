<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Dark.net/com^^</title>
  <desc id="desc">Every week, 14 random links from the less-traveled web.</desc>
  <defs>
    <pattern id="paperTexture" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M-4 18L18 -4M5 22L22 5" stroke="#d8dee9" stroke-opacity="0.035" stroke-width="1"/>
      <circle cx="4" cy="5" r="0.8" fill="#ebcb8b" fill-opacity="0.06"/>
      <circle cx="14" cy="13" r="0.6" fill="#d8dee9" fill-opacity="0.05"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="38" y="38" width="1124" height="554" rx="26" fill="#0d1117" stroke="#88c0d0" stroke-opacity="0.2"/>
  <rect x="38" y="38" width="1124" height="554" rx="26" fill="url(#paperTexture)"/>
  <g transform="translate(940 100)" filter="url(#softGlow)">
    <circle cx="80" cy="80" r="68" fill="#0d1117" fill-opacity="0.72" stroke="#ebcb8b" stroke-width="3"/>
    <circle cx="80" cy="80" r="54" fill="none" stroke="#ebcb8b" stroke-opacity="0.42" stroke-width="2"/>
    <g transform="translate(20.1 14.4) scale(0.82)">
      <path d="M30 61V99M30 80H50M50 61V99" fill="none" stroke="#ebcb8b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 61V99H73C84 99 90 92 90 80S84 61 73 61H62Z" fill="none" stroke="#ebcb8b" stroke-width="5" stroke-linejoin="round"/>
      <path d="M116 61H96V99M96 80H112" fill="none" stroke="#ebcb8b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="80" cy="22" r="5" fill="#ebcb8b"/>
  </g>
  <g fill="#d8dee9" opacity="0.76">
    <circle cx="101" cy="104" r="4"/><circle cx="140" cy="104" r="4"/><circle cx="179" cy="104" r="4"/>
  </g>
  <text x="94" y="302" fill="#edf3ff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="700">Dark.net/com^^</text>
  <rect x="100" y="338" width="208" height="5" rx="2.5" fill="#ebcb8b"/>
  <text x="100" y="414" fill="#d5deee" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="500">14 random links every week.</text>
  <text x="100" y="460" fill="#8fb0d9" font-family="Inter, Arial, sans-serif" font-size="24">Archive of Web-Adresses</text>
  <text x="100" y="532" fill="#ebcb8b" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Originally made for discord-server of HDF.</text>
  <text x="1100" y="532" text-anchor="end" fill="#8fb0d9" font-family="monospace" font-size="18">HDF / 001</text>
